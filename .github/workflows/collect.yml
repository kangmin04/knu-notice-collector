name: Collect KNU notices

on:
  schedule:
    # 매일 10:15 KST(UTC+9) = 01:15 UTC
    - cron: "15 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # data/seen.json 커밋용
  issues: write # 정리 대상 후보 이슈 생성/갱신용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (binary + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache embedding model (relevance filter)
        uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: transformers-model-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run collector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FEED_DATABASE_ID: "22aeaa3935f7424a9c84513ecb611ed9"
          RELEVANCE_THRESHOLD: "0.0504"
        run: node src/collect.js

      - name: Detect cleanup candidates
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FEED_DATABASE_ID: "22aeaa3935f7424a9c84513ecb611ed9"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/cleanup-detect.js

      - name: Commit updated seen-state
        run: |
          git config user.name "knu-notice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen state [skip ci]"
          git push
