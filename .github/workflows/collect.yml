name: Collect KNU notices

on:
  schedule:
    # 매일 09:00 KST(UTC+9) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run collector
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_FEED_DATABASE_ID: "22aeaa3935f7424a9c84513ecb611ed9"
        run: node src/collect.js

      - name: Commit updated seen-state
        run: |
          git config user.name "knu-notice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen state [skip ci]"
          git push
